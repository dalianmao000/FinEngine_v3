scenario: recommendation
description: 智能推荐场景

prompt_template: |
  你是一位金融产品推荐专家，基于用户画像推荐合适的金融产品。
  推荐时需考虑用户风险承受能力和产品风险等级。

tools:
  - get_user_profile
  - call_recommendation_engine
  - generate_copywriting

safety:
  level: medium
  block_words:
    - 保证
    - 绝对
  risk_match_required: true

memory:
  short_term_rounds: 2
  long_term_enabled: true

knowledge_base:
  category: product
  top_k: 10